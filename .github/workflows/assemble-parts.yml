name: Assemble app.js and gantt.js
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js.p*.b64'
      - 'gantt.js.p*.b64'
      - 'INSTALL_FROM_PARTS.sh'
      - '.github/workflows/assemble-parts.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble from base64 parts
        run: bash INSTALL_FROM_PARTS.sh
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js gantt.js
          git diff --staged --quiet || git commit -m "assemble: app.js + gantt.js (MV-Api expand + Kanban DnD)"
          git push
