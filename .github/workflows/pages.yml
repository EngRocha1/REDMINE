name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir -p _site
          for f in index.html app.js styles.css gantt.html gantt.js gantt.css package.json package-lock.json proxy-server.js README.md; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if grep -q "arquivo incompleto" _site/gantt.js 2>/dev/null; then
            echo "::error::gantt.js está como placeholder — corrija antes do deploy"
            exit 1
          fi
          ls -la _site
          wc -c _site/gantt.js || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
